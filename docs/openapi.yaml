openapi: 3.0.0
info:
  title: bapakos API
  version: 1.0.0

servers:
  - url: http://localhost:3000

paths:
  /auth/register:
    post:
      summary: Register User
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum:
                    - USER
                    - TENANT
                  description: Role user
                  example: USER
      responses:
        201:
          description: Register success
  /auth/login:
    post:
      summary: Login user
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Login success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string